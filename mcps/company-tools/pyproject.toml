[project]
name = "company-tools"
version = "0.1.0"
description = "HealthCore company-tools MCP server (incidents + inventory)"
requires-python = ">=3.12"
dependencies = [
    "mcpauth>=0.1.1",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "requests>=2.31.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[project.scripts]
company-tools = "company_tools.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_tools"]

[tool.hatch.build.targets.wheel.force-include]
# keep keycloak export alongside package for discoverability in sdist/docs
"keycloak/realm-export.json" = "company_tools/keycloak/realm-export.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
